model_format: x-species

# Every pair CSV uses query,text,label. Query and text are FASTA protein IDs.
paths:
  fasta: ../../data/proteins.fasta
  train_csv: ../../data/human_train_clean.csv
  # Selection chooses the checkpoint; calibration fits score parameters.
  validation_selection_csv: ../../data/human_validation_selection.csv
  validation_calibration_csv: ../../data/human_validation_calibration.csv

# Architecture shared by training, test, and inference.
model:
  base_model_name: facebook/esm2_t33_650M_UR50D
  base_model_revision: 08e4846e537177426273712802403f7ba8261b6c
  projection_dim: 512
  global_hidden_dim: 512
  projection_dropout: 0.1
  classifier_dropout: 0.1
  max_residues: 800
  exclude_special_tokens: true
  global_symmetry: mean_ordered_logits
  loss_definition: bce_on_mean_ordered_logits

# Effective batch = batch_size_per_device * accumulation steps * GPU count.
training:
  batch_size_per_device: 16
  gradient_accumulation_steps: 2
  target_effective_batch: 96
  max_epochs: 20
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_clip: 1.0
  pos_weight: 10.0
  early_stopping_patience: 3
  seed: 42
  sampler_seed: 0
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  checkpoint_every_updates: 200
  save_every_epoch: true
  gradient_checkpointing: true

# Embed each protein once, then score Global and Maxsim in separate batches.
postprocess:
  embedding_batch_size: 32
  global_batch_size: 4096
  maxsim_pair_batch_size: 32
  cache_dtype: float16

# visible_gpus must contain expected_world_size comma-separated GPU IDs.
runtime:
  visible_gpus: 0,1,2
  expected_world_size: 3
  expected_gpu_name: ''
  requested_precision: bf16
  allow_fp16_fallback: true
  attention: eager
  trust_remote_code: false
  local_files_only: false

# W&B is optional. Disabled runs still complete every training stage.
wandb:
  enabled: false
  mode: online
  project: logoppi
  group: cross_species_global_maxsim_fixed_0p5
  job_type: final-model-training
  log_every_updates: 20
